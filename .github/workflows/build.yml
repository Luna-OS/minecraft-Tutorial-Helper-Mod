# Builds the mod for Fabric, NeoForge and Forge and keeps the three jars as an artifact. A pushed version tag
# (v<mod_version>+<minecraft_version>, e.g. v1.0.0+26.3) also publishes a GitHub release with the jars and that
# version's section of CHANGELOG.md.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build jars
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Collect
        run: |
          mkdir dist
          cp fabric/build/libs/tutorial-tracker-*.jar neoforge/build/libs/tutorial-tracker-*.jar \
            forge/build/libs/tutorial-tracker-*.jar dist/
          ls -la dist
          test "$(ls dist | wc -l)" -eq 3
      - uses: actions/upload-artifact@v7
        with:
          name: tutorial-tracker-jars
          path: dist/*.jar
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%+*}"
          # The section of CHANGELOG.md for this version.
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }' CHANGELOG.md > notes.md
          test -s notes.md || echo "Tutorial Tracker $version" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Tutorial Tracker ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*.jar
